services:
  mariadb:
    image: mariadb:inception
    build:
      context: ./requirements/mariadb
    restart: unless-stopped

    environment:
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}

    secrets:
      - db_root_password
      - db_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

  wordpress:
    image: wordpress:inception
    build:
      context: ./requirements/wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      WP_TITLE: ${WP_TITLE:?WP_TITLE is required}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?WP_ADMIN_USER is required}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?WP_ADMIN_EMAIL is required}
      WP_USER: ${WP_USER:?WP_USER is required}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?WP_USER_EMAIL is required}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
  wordpress_data:

networks:
  inception:
    driver: bridge
